<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List con Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4">To-Do List</h3>

                        <!-- Input -->
                        <div class="input-group mb-3">
                            <input type="text" id="inputTarea" class="form-control" placeholder="Nueva tarea...">
                            <button class="btn btn-primary" id="btnAgregar">Agregar</button>
                        </div>

                        <!-- Lista -->
                        <ul id="listaTareas" class="list-group"></ul>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>

</html>

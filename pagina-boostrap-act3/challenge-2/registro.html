<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina con Bootstrap-2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <!-- Bootstrap JavaScript Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</head>

<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">Registro de Usuario</h2>

        <form class=" bg-light  p-4 rounded">
            <div class="text-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor"
                    class="bi bi-person-circle mb-3" viewBox="0 0 16 16"></svg>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre completo">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Crea una contraseña">
            </div>
            <div class="mb-3">
                <label for="confirmar-password" class="form-label">Confirmar Contraseña</label>
                <input type="password" class="form-control" id="confirmar-password"
                    placeholder="Confirma tu contraseña">
            </div>
            <div class="mb-3">
                <label for="pais" class="form-label">País</label>
                <select class="form-select" id="pais">
                    <option selected disabled>Selecciona tu país...</option>
                    <option value="Ar">Argentina</option>
                    <option value="Cl">Chile</option>
                    <option value="Co">Colombia</option>
                    <option value="Es">España</option>
                    <option value="Mx">México</option>
                    <option value="Pe">Perú</option>
                    <option value="Ve">Venezuela</option>
                </select>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terminos" required>
                <label class="form-check-label" for="terminos">
                    Acepto los <a href="#" target="_blank">Términos y Condiciones</a>
                </label>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary" onclick="alert('Tu registro ha sido exitoso')">Registrarse</button>
            </div>

            </div>

        </form>
    </div>
</body>

</html>
